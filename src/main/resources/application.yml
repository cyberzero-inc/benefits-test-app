server:
  port: 8443
  ssl:
    enabled: true
    protocol: TLSv1.3
    enabled-protocols: TLSv1.3
    ciphers:
      - TLS_AES_256_GCM_SHA384
      - TLS_AES_128_GCM_SHA256
    key-store-type: PKCS12

benefits:
  crypto:
    provider: BC
    record-encryption: AES/GCM/NoPadding
    record-key-agreement: X25519
    submission-signature: SHA256withRSA
    # Available on this build, not enabled by default. See R-2.
    pq-key-encapsulation:
      mechanism: ML-KEM-768
      enabled: false
