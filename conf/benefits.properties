# Benefits system configuration
# R. Whitfield 1998; keys moved out of CryptoUtil 11 Jan 2001

db.driver=oracle.jdbc.driver.OracleDriver
db.url=jdbc:oracle:thin:@benefits-db:1521:BENE
db.user=benefits_app
db.password=benefits

# Record encryption. DO NOT CHANGE - 1998 records are encrypted with this.
crypto.des.key=bene1998
crypto.desede.key=benefits-ssn-key-1999
crypto.password.digest=MD5
crypto.extract.digest=SHA-1
crypto.extract.signature=SHA1withRSA

# Carrier clearing house
carrier.host=clearing.carrier-example.net
carrier.port=443
carrier.ssl.protocol=SSLv3
carrier.ssl.ciphers=SSL_RSA_WITH_3DES_EDE_CBC_SHA,SSL_RSA_WITH_RC4_128_MD5

# Keystore
keystore.path=/opt/benefits/conf/benefits.jks
keystore.password=changeit
keystore.alias=benefits-extract
keystore.keysize=1024
